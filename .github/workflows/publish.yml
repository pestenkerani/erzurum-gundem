name: Haberleri topla ve siteyi yayimla
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 05:00 = Turkey 08:00. GitHub may delay scheduled runs.
    - cron: '0 5 * * *'
permissions:
  contents: read
concurrency:
  group: erzurum-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public export
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Collect and build
        run: python build.py
      - name: Preserve public news archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public news archive'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
